<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Mindclick · Program Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F9F2EC}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{scroll-behavior:smooth}
.howscore summary::marker{color:#A5DFD3}.howscore summary:focus-visible,.detail-toggle:focus-visible{outline:2px solid #A5DFD3;outline-offset:3px}.detail-toggle:hover{background:#F9F2EC!important}

.card-toggle:focus-visible{outline:2px solid #006F62;outline-offset:4px}
.card-toggle:hover h3{text-decoration:underline;text-underline-offset:3px}
.gslide{opacity:0;transition:opacity .9s ease}.gslide.is-on{opacity:1}
.gnav{position:absolute;top:calc((100% - 56px) / 2);transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,255,255,.88);color:#003E32;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .2s}
.gprev{left:10px}.gnext{right:10px}
.gallery:hover .gnav,.gallery:focus-within .gnav{opacity:1}
.gnav:focus-visible,.gdot:focus-visible{outline:2px solid #A5DFD3;outline-offset:2px}
.gdot{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,30,24,.25);cursor:pointer}
.gdot[aria-current="true"]{background:#FFFFFF}
@media (hover: none){.gnav{opacity:1}}
@media (prefers-reduced-motion: reduce){.gslide{transition:none}}

.secnav{scrollbar-width:none}.secnav::-webkit-scrollbar{display:none}
.navlink{display:inline-flex;align-items:center;min-height:52px;margin-bottom:-1px;border-bottom:2px solid transparent;font-family:'ABC Oracle',Inter,'Helvetica Neue',Arial,sans-serif;font-size:14px;font-weight:500;color:#5A5F61;text-decoration:none;white-space:nowrap;transition:color .15s,border-color .15s}
.navlink:hover{color:#003E32}
.navlink[aria-current="true"]{color:#003E32;border-bottom-color:#003E32}
.navlink:focus-visible{outline:2px solid #006F62;outline-offset:-2px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}

.attr-row:hover{background:#FBF7F3}
.attr-row:focus-visible,select:focus-visible{outline:2px solid #006F62;outline-offset:2px}
a{color:#006F62}a:hover{color:#003E32}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">

<div style="display: flex; flex-direction: column; gap: 4px">
<label for="f-scope" style="font-size: 12px; font-weight: 700; color: #5A5F61">Scope</label>
<select id="f-scope" data-options="scopeGroups" value="{{scopeKey}}" onChange="{{pickScope}}" style="min-height: 44px; padding: 0 12px; border: 1px solid #D9CCBF; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; color: #25282A"></select>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="f-type" style="font-size: 12px; font-weight: 700; color: #5A5F61">Project type</label>
<select id="f-type" data-options="typeGroups" value="{{typeKey}}" onChange="{{pickType}}" style="min-height: 44px; padding: 0 12px; border: 1px solid #D9CCBF; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; color: #25282A"></select>
</div>
</div>
</header>

<section id="portfolio" aria-label="Key takeaway" style="scroll-margin-top: 76px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px 40px; padding: 4px 0">
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-size: 26px; line-height: 1.3; font-weight: 400; color: #25282A; max-width: 1100px">{{tk.pre}}<strong style="font-weight: 700; color: #003E32">{{tk.lead}}</strong>{{tk.mid}}<strong style="font-weight: 700; color: #003E32">{{tk.cmp}}</strong>{{tk.tail}}</p>

</div>
<sc-if value="{{ gal.has }}" hint-placeholder-val="{{ true }}">
<div class="gallery" role="region" aria-roledescription="carousel" aria-label="Project photos" style="position: relative; flex: 0 1 340px; min-width: 260px; background: #FFFFFF; border: 1px solid #E7DCD1; border-top: 4px solid #63A09A; border-radius: 10px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr)">
<sc-for list="{{gal.slides}}" as="g" hint-placeholder-count="3"><figure class="{{g.cls}}" aria-roledescription="slide" style="grid-area: 1 / 1; margin: 0; min-width: 0; display: flex; flex-direction: column">
<img src="{{g.src}}" alt="{{g.name}}" style="width: 100%; height: auto; aspect-ratio: 16 / 10; flex: none; object-fit: cover; display: block">
<figcaption style="padding: 10px 14px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px">
<span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><strong title="{{g.name}}" style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 700; color: #003E32; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.name}}</strong><span style="font-size: 12px; color: #5A5F61">{{g.meta}}</span></span>
<sc-if value="{{ g.hasScore }}" hint-placeholder-val="{{ true }}"><span style="flex: none; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: {{g.scBg}}; color: {{g.scFg}}; white-space: nowrap">{{g.score}}</span></sc-if>
</figcaption>
</figure></sc-for>
<sc-if value="{{ gal.multi }}" hint-placeholder-val="{{ true }}">
<button type="button" class="gnav gprev" aria-label="Previous photo"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg></button>
<button type="button" class="gnav gnext" aria-label="Next photo"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg></button>
<div class="gdots" style="position: absolute; left: 0; right: 0; top: 0; aspect-ratio: 16 / 10; display: flex; align-items: flex-end; justify-content: center; gap: 5px; padding-bottom: 8px; pointer-events: none">
<sc-for list="{{gal.slides}}" as="g" hint-placeholder-count="3"><button type="button" class="gdot" data-idx="{{g.idx}}" aria-label="{{g.label}}" aria-current="{{g.cur}}" style="pointer-events: auto"></button></sc-for>
</div>
</sc-if>
</div>
</sc-if>
</section>

<sc-if value="{{ c.history }}" hint-placeholder-val="{{ true }}"><section aria-label="Summary" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #E7DCD1; border-top: 4px solid #63A09A; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; font-weight: 700; color: #5A5F61">{{tl.pLabel}}</div>
<div style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 38px; font-weight: 700; line-height: 1; color: #003E32">{{tl.projects}}</div>
<div style="font-size: 13px; color: #5A5F61">{{tl.areaTotal}}</div>
<div style="font-size: 13px; font-weight: 500; color: #006F62">{{tl.projScore}}</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #E7DCD1; border-top: 4px solid #63A09A; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; font-weight: 700; color: #5A5F61">Total spend</div>
<div style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 38px; font-weight: 700; line-height: 1; color: #003E32">{{tl.spendTotal}}</div>
<div style="font-size: 13px; color: #5A5F61">{{tl.suppliers}}</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #E7DCD1; border-top: 4px solid #63A09A; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; font-weight: 700; color: #5A5F61">Rated spend</div>
<div style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 38px; font-weight: 700; line-height: 1; color: {{accent}}">{{tl.spend.pct}}</div>
<sc-if value="{{ tl.spend.hasCmp }}" hint-placeholder-val="{{ true }}"><div style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 500; color: {{tl.spend.dColor}}">{{tl.spend.delta}}</div></sc-if>
<div style="font-size: 13px; color: #5A5F61">{{tl.spend.sub}}</div>
<div style="display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: #D6D7D2; margin-top: 4px" aria-hidden="true"><div style="width: {{tl.spend.lw}}; background: {{accent}}"></div><div style="width: {{tl.spend.aw}}; background: #FF8674"></div><div style="width: {{tl.spend.sw}}; background: #A5DFD3"></div></div>
<div style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; font-weight: 500; color: #5A5F61"><span>Leader {{tl.spend.l}}</span><span>Achiever {{tl.spend.a}}</span><span>Starter {{tl.spend.s}}</span></div>
</div>
<div style="background: #FFFFFF; border: 1px solid #E7DCD1; border-top: 4px solid #63A09A; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; font-weight: 700; color: #5A5F61">Rated surface area</div>
<div style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 38px; font-weight: 700; line-height: 1; color: {{accent}}">{{tl.area.pct}}</div>
<sc-if value="{{ tl.area.hasCmp }}" hint-placeholder-val="{{ true }}"><div style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 500; color: {{tl.area.dColor}}">{{tl.area.delta}}</div></sc-if>
<div style="font-size: 13px; color: #5A5F61">{{tl.area.sub}}</div>
<div style="display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: #D6D7D2; margin-top: 4px" aria-hidden="true"><div style="width: {{tl.area.lw}}; background: {{accent}}"></div><div style="width: {{tl.area.aw}}; background: #FF8674"></div><div style="width: {{tl.area.sw}}; background: #A5DFD3"></div></div>
<div style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; font-weight: 500; color: #5A5F61"><span>Leader {{tl.area.l}}</span><span>Achiever {{tl.area.a}}</span><span>Starter {{tl.area.s}}</span></div>
</div>
</section></sc-if>

<section id="features" aria-label="Features" style="scroll-margin-top: 76px; background: #FFFFFF; border: 1px solid #E7DCD1; border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 4px; max-width: 860px">
<h2 style="margin: 0; font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: 700; color: #003E32">Features</h2>
<p style="margin: 0; font-size: 14px; color: #5A5F61">{{c.attrSub}}</p>
<sc-if value="{{ c.history }}" hint-placeholder-val="{{ true }}"><span style="display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 500; color: #5A5F61"><span style="width: 2px; height: 14px; background: #25282A"></span>{{c.peerLabel}}</span></sc-if>
</div>
<span style="font-size: 13px; font-weight: 500; color: #003E32; background: #E4F4EF; padding: 6px 12px; border-radius: 999px">Ready for sustainability reporting &amp; RFPs</span>
</div>
<div style="background: #003E32; border-radius: 12px; padding: 22px 26px; display: flex; flex-wrap: wrap; gap: 20px 40px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 220px">
<span style="font-size: 13px; font-weight: 700; color: #A5DFD3">{{c.scoreLabel}}</span>
<span style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 56px; font-weight: 700; line-height: 1; color: #FFFFFF">{{fs.overall}}<span style="font-size: 22px; font-weight: 500; color: #A5DFD3">{{fs.suffix}}</span><sc-if value="{{ fs.hasTier }}" hint-placeholder-val="{{ true }}"><span style="display: inline-block; vertical-align: middle; margin-left: 14px; font-size: 15px; font-weight: 700; color: #003E32; background: #A5DFD3; padding: 5px 12px; border-radius: 999px">{{fs.tier}}</span></sc-if></span>
<sc-if value="{{ c.history }}" hint-placeholder-val="{{ true }}"><span style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 500; color: #D9EEE8">{{fs.deltaText}} vs. a typical Mindclick project ({{fs.ind}})</span></sc-if>
</div>
<div style="flex: 1 1 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px">
<sc-for list="{{fs.cats}}" as="k" hint-placeholder-count="4">
<div style="background: #FFFFFF; border-radius: 10px; padding: 12px 14px; display: flex; gap: 12px; align-items: center">
<img src="{{k.icon}}" alt="" width="36" height="36" style="width: 36px; height: 36px; flex: none; display: block">
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 13px; font-weight: 500; color: #5A5F61">{{k.name}}</span>
<span style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; line-height: 1.1; color: #003E32">{{k.score}} <span style="font-size: 13px; font-weight: 500; color: #5A5F61">{{k.peerText}}</span></span>
</div>
</div>
</sc-for>
</div>
<p style="margin: 0; flex-basis: 100%; font-size: 12px; color: #A5DFD3">{{c.scoreNote}}</p>
<sc-if value="{{ c.history }}" hint-placeholder-val="{{ true }}"><details class="howscore" style="flex-basis: 100%; margin-top: -8px">
<summary style="cursor: pointer; font-size: 13px; font-weight: 500; color: #FFFFFF; width: fit-content">How is this scored?</summary>
<ol style="margin: 10px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.5; color: #D9EEE8; max-width: 900px">
<sc-for list="{{c.howSteps}}" as="h" hint-placeholder-count="4"><li>{{h.t}}</li></sc-for>
</ol>
</details></sc-if>
</div>
<button type="button" class="detail-toggle" aria-expanded="{{detailT.expanded}}" onClick="{{detailT.go}}" style="all: unset; box-sizing: border-box; align-self: flex-start; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border: 1px solid #D9CCBF; border-radius: 999px; background: #FFFFFF; font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; font-weight: 500; color: #003E32">{{detailT.label}}<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{detailT.rot}}); transition: transform 0.2s"><path d="M4 6l4 4 4-4"/></svg></button>
<sc-if value="{{ detailT.show }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<sc-for list="{{attrCols}}" as="col" hint-placeholder-count="2">
<div style="flex: 1 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{col.groups}}" as="grp" hint-placeholder-count="2">
<div style="background: #FFFFFF; border: 1px solid #E7DCD1; border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0">
<button type="button" class="card-toggle" aria-expanded="{{grp.expanded}}" onClick="{{grp.toggle}}" style="all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: flex; gap: 14px; align-items: center; border-radius: 8px; font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; color: #25282A">
<img src="{{grp.icon}}" alt="" width="48" height="48" style="width: 48px; height: 48px; flex: none; display: block">
<h3 style="margin: 0; font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-size: 18px; font-weight: 700; color: #003E32">{{grp.name}}</h3>
<sc-if value="{{ c.history }}"><span style="margin-left: auto; font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700; color: #003E32; background: #E4F4EF; padding: 6px 12px; border-radius: 999px; white-space: nowrap">Score {{grp.score}}{{grp.peerText}}</span></sc-if>
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#5A5F61" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; transform: rotate({{grp.chevRot}}); transition: transform 0.2s"><path d="M4 6l4 4 4-4"/></svg></button>
<sc-if value="{{ grp.open }}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr) 60px 20px; gap: 16px; padding-bottom: 8px; border-bottom: 1px solid #E7DCD1; font-size: 12px; font-weight: 700; color: #5A5F61">
<span>Feature</span><span>Spend</span><span>Surface area</span><span style="text-align: right">Projects of all Mindclick</span><span></span>
</div>
<sc-for list="{{grp.rows}}" as="m" hint-placeholder-count="2">
<button type="button" class="attr-row" aria-expanded="{{m.expanded}}" onClick="{{m.toggle}}" style="all: unset; box-sizing: border-box; width: 100%; cursor: {{m.cursor}}; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr) 60px 20px; gap: 16px; align-items: center; min-height: 64px; padding: 8px 6px; margin: 0 -6px; border-bottom: 1px solid #F1E8DF; border-radius: 6px; font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; color: #25282A">
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-size: 15px; font-weight: 700">{{m.name}}</span>
<span style="font-size: 12px; line-height: 1.4; color: #5A5F61">{{m.note}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 8px; align-items: center">
<div style="position: relative; height: 16px">
<div style="position: absolute; left: 0; right: 0; top: 4px; height: 8px; background: #F1E8DF; border-radius: 3px"></div>
<div style="position: absolute; left: 0; top: 4px; height: 8px; border-radius: 3px; background: #006F62; width: {{m.sp.w}}"></div>
<sc-if value="{{ m.sp.showPeer }}" hint-placeholder-val="{{ true }}"><div style="position: absolute; top: 0; width: 2px; height: 16px; background: #25282A; left: {{m.sp.peerL}}"></div></sc-if>
</div>
<span style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 700; text-align: right; color: #006F62">{{m.sp.v}}</span>
</div>
<sc-if value="{{ m.sp.showPeer }}" hint-placeholder-val="{{ true }}"><span style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 500; color: {{m.sp.dColor}}">{{m.sp.delta}} vs. avg {{m.sp.peer}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 8px; align-items: center">
<div style="position: relative; height: 16px">
<div style="position: absolute; left: 0; right: 0; top: 4px; height: 8px; background: #F1E8DF; border-radius: 3px"></div>
<div style="position: absolute; left: 0; top: 4px; height: 8px; border-radius: 3px; background: #457F79; width: {{m.ar.w}}"></div>
<sc-if value="{{ m.ar.showPeer }}" hint-placeholder-val="{{ true }}"><div style="position: absolute; top: 0; width: 2px; height: 16px; background: #25282A; left: {{m.ar.peerL}}"></div></sc-if>
</div>
<span style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 700; text-align: right; color: #457F79">{{m.ar.v}}</span>
</div>
<sc-if value="{{ m.ar.showPeer }}" hint-placeholder-val="{{ true }}"><span style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 500; color: {{m.ar.dColor}}">{{m.ar.delta}} vs. avg {{m.ar.peer}}</span></sc-if>
</div>
<span style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 13px; text-align: right; color: #5A5F61">{{m.count}}</span>
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#5A5F61" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{m.chevRot}}); transition: transform 0.2s; opacity: {{m.chevOp}}"><path d="M4 6l4 4 4-4"/></svg>
</button>
<sc-if value="{{ m.isOpen }}" hint-placeholder-val="{{ false }}">
<div style="background: #F9F2EC; border-radius: 8px; padding: 16px 18px; margin: 8px 0 12px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 13px; color: #5A5F61">
<span>Your average <strong style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-weight: 700; color: #003E32">{{m.d.yours}}</strong></span>
<span>Mindclick average <strong style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-weight: 700; color: #25282A">{{m.d.peers}}</strong></span>
<span>Top project <strong style="font-weight: 700; color: #003E32">{{m.d.topName}}</strong></span>
<span style="display: inline-flex; gap: 6px; align-items: center"><span style="width: 2px; height: 12px; background: #25282A"></span>= your average</span>
</div>
<sc-for list="{{m.d.rows}}" as="r" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: minmax(120px, 220px) minmax(0, 1fr); gap: 14px; align-items: center">
<span style="font-size: 14px; font-weight: 700; overflow-wrap: anywhere">{{r.name}}</span>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: grid; grid-template-columns: 40px minmax(0, 1fr) 44px; gap: 8px; align-items: center">
<span style="font-size: 12px; font-weight: 500; color: #5A5F61">Spend</span>
<div style="position: relative; height: 14px">
<div style="position: absolute; left: 0; right: 0; top: 3px; height: 8px; background: #EFE4D9; border-radius: 3px"></div>
<div style="position: absolute; left: 0; top: 3px; height: 8px; border-radius: 3px; background: #006F62; width: {{r.spendW}}"></div>
<div style="position: absolute; top: -1px; width: 2px; height: 16px; background: #25282A; left: {{m.d.spendAvgL}}"></div>
</div>
<span style="font-family: 'ABC Oracle', Inter, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700; text-align: right">{{r.spend}}</span>
</div>
<div style="display: grid; grid-template-columns: 40px minmax(0, 1fr) 44px; gap: 8px; align-items: center">
<span style="font-size: 12px; font-weight: 500; color: #5A5F61">Area</span>
<div style="position: relative; height: 14px">
<div style="position: absolute; left: 0; right: 0; top: 3px; height: 8px; background: #EFE4D9; border-radius: 3px"></div>

  renderVals() {

    const projLabel = isProject ? (PROJ_PICKS.find((x) => x.pi === projSel) || { label: D.projects[projSel][0] }).label : '';
    const S = isProject ? [projLabel, 'Project', 'Project', this._projIds[projSel]] : D.stk[stkIdx];

    const poFor = (i) => (this._hasPO[i] ? PO : -1);

    const spaceAvail = avail((r) => r[1], (r) => ptype < 0 || D.projects[r[0]][4] === ptype);

    // Mindclick average = average Mindclick project (procurement views: purchase orders where a project has them)
    const poPool = !generic && isProc;
    if (!this._projPO) { this._projPO = new Set(); D.rows.forEach((r) => { if (r[10] === PO) this._projPO.add(r[0]); }); }
    const pool = this._cached('pool|' + fkey + '|' + (poPool ? 1 : 0), () => {

      const q = (arr, t) => { if (!arr.length) return null; const a = arr.slice().sort((x, y) => x - y); const k = (a.length - 1) * t, lo = Math.floor(k); return a[lo] + (a[Math.min(lo + 1, a.length - 1)] - a[lo]) * (k - lo); };

      if (dots.length <= 1) return dots.length ? dots[0].color : '#D6D7D2';
      const step = 100 / dots.length;
      return 'linear-gradient(90deg, ' + dots.map((d, i) => d.color + ' ' + (i * step).toFixed(1) + '% ' + ((i + 1) * step).toFixed(1) + '%').join(', ') + ')';
    };
    const ratedV = roster.filter((v) => v.rated).map((v) => ({ name: v.name, bg: dotBg(v.dots), tip: (v.dots.length > 1 ? 'Mixed tiers: ' : '') + v.dots.map((d) => d.label).join(', ') }));
    const unratedV = roster.filter((v) => !v.rated).map((v) => ({ name: v.name }));
    const vend = { rated: ratedV, unrated: unratedV, nRated: String(ratedV.length), nUnrated: String(unratedV.length), hasUnrated: unratedV.length > 0,
      unratedSub: isProc && !generic ? 'Not in the Mindclick program · vendors to invite' : 'Not in the Mindclick program' };
    c.supTitle = generic ? 'Vendors on Mindclick projects' : isProc ? 'Your vendor roster' : 'Vendors on your projects';
    if (isProject) c.supTitle = 'Vendors on this project';
    c.supNote = ratedV.length + ' of ' + roster.length + ' vendors are in the Mindclick program';
    const vendors = [], supGroups = [], sortT = { sp: {}, ar: {} };

    const galSrc = generic ? [...all.projs.entries()] : [...me.projs.entries()];
    const galSlides = galSrc.filter(([pi]) => D.photos[pi]).sort((a, b) => b[1].sp - a[1].sp || b[1].ar - a[1].ar).slice(0, 12).map(([pi], i) => {
      const P = D.projects[pi], ps = P[3];
      const pt = ps == null ? null : ps >= 160 ? 'Leader' : ps >= 100 ? 'Achiever' : ps >= 1 ? 'Starter' : null;
      const pc = pt ? pill[pt] : ['#E4E5E1', '#25282A'];
      return { src: D.photos[pi], name: P[5] || P[0], meta: [P[1], P[2]].filter(Boolean).join(', '), score: pt ? 'Score ' + ps + ' · ' + pt : '', hasScore: !!pt,
        scBg: pc[0], scFg: pc[1], cls: i === 0 ? 'gslide is-on' : 'gslide', idx: String(i), label: 'Show photo ' + (i + 1), cur: String(i === 0) };
    });
    const gal = { has: !generic && galSlides.length > 0, multi: galSlides.length > 1, slides: galSlides, n: String(galSlides.length) };
    const nav = [
      { id: 'portfolio', label: generic ? 'Program Overview' : isProject ? 'Project Performance' : 'Portfolio Performance' },
      { id: 'features', label: 'Features' },
      { id: 'benchmark', label: 'Peer Benchmark' },
      { id: 'suppliers', label: generic ? 'Vendors' : 'Your Vendors' }
    ].map((n, i) => ({ ...n, cur: String(i === 0) }));
    return { nav, gal, vend, detailT, accent, highlight, asOf: D.asOf, c, tk, tl, fs, attrCols, bench, projects, vendors,
      stkKey: generic ? 'generic' : isProject ? 'p:' + projSel : String(stkIdx), stkOpts, stkGroups: [{ label: '', opts: [{ key: 'generic', label: 'Mindclick overview (no project history)' }] }, { label: 'Procurement', opts: stkOpts.proc }, { label: 'A&D firms', opts: stkOpts.ad }, { label: 'Projects', opts: stkOpts.proj }], scopeGroups: [{ label: '', opts: [{ key: 'all', label: 'All scopes' }].concat(scopeOpts) }], typeGroups: [{ label: '', opts: [{ key: 'all', label: 'All project types' }].concat(typeOpts) }], pickStk, scopeKey: scope < 0 ? 'all' : String(scope), scopeOpts, pickScope, typeKey: ptype < 0 ? 'all' : String(ptype), typeOpts, pickType };
  }
}

const SVGNS = 'http://www.w3.org/2000/svg';
const tplDoc = new DOMParser().parseFromString('<body>' + document.getElementById('tpl').textContent + '</body>', 'text/html');
const comp = new Component();
comp.props = { stakeholder: 'Benjamin West', audience: 'generic', accent: '#003E32', highlight: '#25282A' };
const get = (s, p) => p.trim().split('.').reduce((o, k) => (o == null ? undefined : o[k]), s);
const strip = (v) => v.replace(/^\s*\{\{\s*|\s*\}\}\s*$/g, '');
const interp = (str, s) => str.replace(/\{\{\s*([\w.]+)\s*\}\}/g, (m, p) => { const v = get(s, p); return v == null ? '' : String(v); });
function walk(src, scope, parent, inSvg) {
  for (const n of src.childNodes) {
    if (n.nodeType === 3) { parent.appendChild(document.createTextNode(interp(n.nodeValue, scope))); continue; }
    if (n.nodeType !== 1) continue;
    const tag = n.tagName.toLowerCase();
    if (tag === 'sc-for') { const list = get(scope, strip(n.getAttribute('list'))) || []; const as = n.getAttribute('as'); list.forEach((it) => walk(n, Object.assign({}, scope, { [as]: it }), parent, inSvg)); continue; }
    if (tag === 'sc-if') { if (get(scope, strip(n.getAttribute('value')))) walk(n, scope, parent, inSvg); continue; }
    const svg = inSvg || tag === 'svg';
    const el = svg ? document.createElementNS(SVGNS, tag) : document.createElement(tag);
    let selVal = null;
    for (const at of n.attributes) {
      const name = at.name, val = at.value;
      if (name.startsWith('hint-')) continue;
      if (name === 'onclick') { const f = get(scope, strip(val)); if (f) el.addEventListener('click', f); continue; }
      if (name === 'onchange') { const f = get(scope, strip(val)); if (f) el.addEventListener('change', f); continue; }
      if (name === 'value' && tag === 'select') { selVal = interp(val, scope); continue; }
      if (name === 'data-options') {
        (get(scope, val) || []).forEach((g) => {
          const host = g.label ? el.appendChild(Object.assign(document.createElement('optgroup'), { label: g.label })) : el;
          g.opts.forEach((o) => host.appendChild(Object.assign(document.createElement('option'), { value: o.key, textContent: o.label })));
        });
        continue;
      }
      el.setAttribute(name, interp(val, scope));
    }
    walk(n, scope, el, svg);
    parent.appendChild(el);
    if (selVal != null) el.value = selVal;
  }
}
function render() {
  const root = document.getElementById('app');
  const y = window.scrollY;
  const focusId = document.activeElement && document.activeElement.id;
  const vals = comp.renderVals();
  const frag = document.createDocumentFragment();
  walk(tplDoc.body, vals, frag, false);
  root.replaceChildren(frag);
  window.scrollTo(0, y);
  if (focusId) { const f = document.getElementById(focusId); if (f) f.focus(); }
  if (typeof updateNav === 'function') updateNav();
  initGallery();
}
render();
var navLock = null, navTimer = null;
function updateNav() {
  const links = [...document.querySelectorAll('.navlink')];
  if (!links.length) return;
  let cur = links[0], best = -Infinity;
  if (navLock) cur = links.find((l) => l.dataset.sec === navLock) || cur;
  else {
    for (const l of links) {
      const el = document.getElementById(l.dataset.sec); if (!el) continue;
      const t = el.getBoundingClientRect().top;
      if (t - 90 <= 1 && t > best + 1) { best = t; cur = l; }
    }
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = links[links.length - 1];
  }
  links.forEach((l) => l.setAttribute('aria-current', l === cur ? 'true' : 'false'));
}
var navRaf = 0;
window.addEventListener('scroll', () => { if (!navRaf) navRaf = requestAnimationFrame(() => { navRaf = 0; updateNav(); }); }, { passive: true });
document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('.navlink'); if (!a) return;
  navLock = a.dataset.sec; updateNav(); clearTimeout(navTimer);
  navTimer = setTimeout(() => { navLock = null; }, 1000);
});
updateNav();


var galTimer = null;
function initGallery() {
  clearInterval(galTimer); galTimer = null;
  const g = document.querySelector('.gallery'); if (!g) return;
  const slides = [...g.querySelectorAll('.gslide')], dots = [...g.querySelectorAll('.gdot')];
  if (slides.length < 2) return;
  let i = 0, paused = false;
  const show = (k) => { i = (k + slides.length) % slides.length; slides.forEach((s, j) => s.classList.toggle('is-on', j === i)); dots.forEach((d, j) => d.setAttribute('aria-current', j === i ? 'true' : 'false')); };
  g.querySelector('.gprev').addEventListener('click', () => show(i - 1));
  g.querySelector('.gnext').addEventListener('click', () => show(i + 1));
  dots.forEach((d) => d.addEventListener('click', () => show(+d.dataset.idx)));
  g.addEventListener('mouseenter', () => { paused = true; }); g.addEventListener('mouseleave', () => { paused = false; });
  g.addEventListener('focusin', () => { paused = true; }); g.addEventListener('focusout', () => { paused = false; });
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  galTimer = setInterval(() => { if (!paused && !document.hidden) show(i + 1); }, 6000);
}
initGallery();
